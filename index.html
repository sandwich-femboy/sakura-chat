const SUPABASE_URL = "https://qihezcbypdccnwplumyk.supabase.co";
const SUPABASE_KEY = "sb_publishable_6hqsxj34YAmbGOdsYsfMKA__POWPU15";
const SESSION_KEY = "sakura_session_v1";

const chatEl = document.getElementById("chat");
const msgEl = document.getElementById("msg");
const sendEl = document.getElementById("send");
const statusEl = document.getElementById("status");
const loginEl = document.getElementById("login");
const loginErrEl = document.getElementById("loginErr");
const logoutBtn = document.getElementById("logoutBtn");

let session = null;
let history = [];
let busy = false;

/* ---------- 会话管理 ---------- */
function loadSession() {
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch (e) { session = null; }
}
function saveSession(s) {
  session = s;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
}
function clearSession() {
  session = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

async function login(email, password) {
  const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  });
  if (!r.ok) throw new Error("邮箱或密码不对");
  const d = await r.json();
  saveSession({
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: Date.now() + ((d.expires_in || 3600) * 1000)
  });
}

async function refreshSession() {
  if (!session || !session.refresh_token) return false;
  try {
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if (!r.ok) return false;
    const d = await r.json();
    saveSession({
      access_token: d.access_token,
      refresh_token: d.refresh_token || session.refresh_token,
      expires_at: Date.now() + ((d.expires_in || 3600) * 1000)
    });
    return true;
  } catch (e) { return false; }
}

async function ensureToken() {
  if (!session || !session.access_token) return false;
  if (Date.now() > (session.expires_at - 120000)) {
    return await refreshSession();
  }
  return true;
}

/* ---------- 云端历史 ---------- */
async function loadCloudHistory() {
  await ensureToken();
  const r = await fetch(
    SUPABASE_URL + "/rest/v1/messages?select=id,role,content&order=created_at.asc&limit=300",
    { headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + session.access_token } }
  );
  if (!r.ok) throw new Error("读取云端历史失败");
  const rows = await r.json();
  history = rows.map(function (x) {
    return { role: x.role === "user" ? "user" : "assistant", text: x.content };
  });
  return history;
}

async function saveMessage(role, text) {
  try {
    await ensureToken();
    await fetch(SUPABASE_URL + "/rest/v1/messages", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + session.access_token,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify([{ role: role, content: text }])
    });
  } catch (e) { /* 云端失败不影响本地聊天 */ }
}

/* ---------- 渲染 ---------- */
function renderRow(role, text) {
  const isMe = role === "user";
  const row = document.createElement("div");
  row.className = "row " + (isMe ? "me" : "bot");
  const img = document.createElement("img");
  img.className = "avatar";
  img.src = isMe ? AVATAR_USER : AVATAR_BOT;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(img);
  row.appendChild(b);
  chatEl.appendChild(row);
}

function renderAll() {
  chatEl.innerHTML = "";
  if (!history.length) {
    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = "这里是樱，哥哥想聊什么呀";
    chatEl.appendChild(tip);
  }
  history.forEach(function (m) { renderRow(m.role, m.text); });
  scrollBottom();
}

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function setTyping(on) {
  let el = document.getElementById("typing");
  if (on) {
    if (!el) {
      el = document.createElement("div");
      el.id = "typing";
      el.className = "tip";
      el.textContent = "樱正在输入…";
      chatEl.appendChild(el);
      scrollBottom();
    }
  } else if (el) { el.remove(); }
}

/* ---------- 聊天 ---------- */
async function callApi() {
  const messages = [{ role: "system", content: PERSONA }];
  const recent = history.slice(-MAX_HISTORY);
  recent.forEach(function (m) {
    messages.push({ role: m.role === "user" ? "user" : "assistant", content: m.text });
  });
  const resp = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
    body: JSON.stringify({
      model: MODEL,
      messages: messages,
      max_tokens: 300,
      thinking: { type: "disabled" }
    })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + resp.status));
  return data.choices[0].message.content;
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function splitSegments(text) {
  // 按句末标点/换行拆成多条，模仿 QQ 分段发送
  var parts = text.split(/(?<=[。！？!?~…\n])\s*/).map(function (s) { return s.trim(); }).filter(Boolean);
  if (!parts.length) parts = [text];
  // 太长的段再拆一刀
  var out = [];
  parts.forEach(function (p) {
    if (p.length <= 60) { out.push(p); return; }
    var chunks = p.match(/[\s\S]{1,45}[。！？!?~…]?/g) || [p];
    chunks.forEach(function (c) { if (c.trim()) out.push(c.trim()); });
  });
  return out;
}

async function speakSegments(text) {
  var segs = splitSegments(text);
  for (var i = 0; i < segs.length; i++) {
    if (i > 0) {
      setTyping(true);
      await sleep(650 + Math.random() * 500);
      setTyping(false);
    }
    renderRow("assistant", segs[i]);
    scrollBottom();
  }
}

async function send() {
  const text = msgEl.value.trim();
  if (!text || busy) return;
  busy = true;
  msgEl.value = "";
  history.push({ role: "user", text: text });
  renderRow("user", text);
  scrollBottom();
  saveMessage("user", text);

  sendEl.disabled = true;
  setTyping(true);
  try {
    const reply = await callApi();
    setTyping(false);
    const out = (reply || "").trim() || "（樱走神了，稍等再试试）";
    history.push({ role: "assistant", text: out });
    saveMessage("assistant", out);
    await speakSegments(out);
  } catch (e) {
    setTyping(false);
    const out = "（樱暂时连不上了，检查一下网络再试试）";
    renderRow("assistant", out);
    scrollBottom();
  } finally {
    sendEl.disabled = false;
    busy = false;
    msgEl.focus();
  }
}

/* ---------- 启动 ---------- */
async function boot() {
  loadSession();
  if (session && await ensureToken()) {
    loginEl.style.display = "none";
    logoutBtn.style.display = "block";
    try {
      await loadCloudHistory();
      renderAll();
      statusEl.textContent = "在线 · 记忆已同步";
    } catch (e) {
      statusEl.textContent = "在线（云端读取失败）";
    }
  } else {
    clearSession();
    loginEl.style.display = "flex";
  }
}

document.getElementById("loginBtn").addEventListener("click", async function () {
  const email = document.getElementById("email").value.trim();
  const pwd = document.getElementById("pwd").value;
  loginErrEl.textContent = "";
  if (!email || !pwd) { loginErrEl.textContent = "请填邮箱和密码"; return; }
  try {
    await login(email, pwd);
    loginEl.style.display = "none";
    logoutBtn.style.display = "block";
    await loadCloudHistory();
    renderAll();
    statusEl.textContent = "在线 · 记忆已同步";
  } catch (e) {
    loginErrEl.textContent = e.message || "登录失败";
  }
});

logoutBtn.addEventListener("click", function () {
  clearSession();
  history = [];
  renderAll();
  loginEl.style.display = "flex";
  logoutBtn.style.display = "none";
});

sendEl.addEventListener("click", send);
msgEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

boot();
</script>
</body>
</html>
